<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>碩碩說：解決學生問題的影音頻道</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">碩碩說｜解決學生問題的影音頻道</p>
      <h1>一起設計出自己的煩惱解決方案</h1>
      <p>簡單說說你最近的煩惱，我們會推薦適合的影片，並提供學習單，跟著我們一起找到下一步。</p>
    </header>

    <section class="search-panel" aria-label="搜尋工具">
      <label for="search">最近有什麼事情讓你感到困擾？</label>
      <div class="search-row">
        <input id="search" type="search" placeholder="也可以輸入：失戀、拖延、沒朋友、讀書分心、找不到未來方向" autocomplete="off">
        <button id="search-button" type="button">找影片</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="category-section" aria-labelledby="category-title">
      <h2 id="category-title">你現在最想解決哪一類問題？</h2>
      <div id="categories" class="categories"></div>
    </section>

    <section>
      <h2 class="results-title">推薦內容</h2>
      <div id="results" class="results"></div>
      <p id="empty" class="empty" hidden>目前沒有符合的內容，請換一個關鍵字。</p>
    </section>

    <footer class="site-footer">
      <p>本頁提供教育影片推薦，不是心理診斷或緊急服務。</p>
      <p>如果你有傷害自己或他人的想法，請立即聯絡可信任的人、學校諮商中心、資源教室或當地緊急求助單位。</p>
      <p class="privacy-note">你的文字不會被儲存。準備好時，就說說最近的困擾吧。</p>
    </footer>
  </main>
  <script src="assets/site.js" defer></script>
</body>
</html>
