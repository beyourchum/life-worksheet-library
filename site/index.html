<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>影片與學習單搜尋</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LIFE WORKSHEET LIBRARY</p>
      <h1>找到適合現在的影片與學習單</h1>
      <p>輸入 EP 編號、標題或關鍵字，找到可以觀看與練習的內容。</p>
    </header>

    <section class="search-panel" aria-label="搜尋工具">
      <label for="search">搜尋</label>
      <input id="search" type="search" placeholder="例如：EP62、求助、人際關係" autocomplete="off">
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section>
      <div id="results" class="results"></div>
      <p id="empty" class="empty" hidden>目前沒有符合的內容，請換一個關鍵字。</p>
    </section>
  </main>
  <script src="assets/site.js" defer></script>
</body>
</html>
